services:
  api:
    build: .
    container_name: wishlist
    depends_on:
      - db
      - migrate
    env_file:
      - .env
    ports:
      - "8082:8080"
    restart: always
    networks:
      - wishlist-net
  db:
    image: postgres:16
    container_name: wishlist-postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: always
    networks:
      - wishlist-net

  migrate:
    image: migrate/migrate:v4.16.0
    container_name: wishlist-migrate
    env_file:
      - .env
    depends_on:
      - db
    command: [
      "-path=/migrations",
      "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE}",
      "up"
    ]
    volumes:
      - ./db/migrations:/migrations
    networks:
      - wishlist-net

volumes:
  pg_data:

networks:
  wishlist-net:
    external: true